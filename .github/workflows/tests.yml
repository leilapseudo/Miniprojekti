name: Tests

# Kontrolloi milloin workflow käynnistyy
on:
  # Push ja pull request toimivat vain main-branchilla
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Sallii käynnistää workflown myös Actions-välilehdeltä
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Asenna riippuvuudet
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-sqlalchemy \
            python-dotenv getenv requests pytest \
            robotframework robotframework-browser \
            robotframework-browser-batteries

      - name: Yksikkötestit
        run: pytest

      - name: Käynnistä sovellus taustalle
        run: |
          python app.py &
          sleep 5

      - name: Robot testit
        run: robot --outputdir robot-results tests/robot

      - name: Robotin testaus raportit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: robot-results
