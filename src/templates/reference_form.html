<div>
  <h1>Add a {{reference.type}} reference or something else</h1>
  <form action="/" method="GET">
    <button type="submit" name="choice"  value="book">Book</button>
    <button type="submit" name="choice"  value="article">Article</button>
    <button type="submit" name="choice"  value="inproceedings">Inproceedings</button>
  </form>

  <form method="post" action="/references">

    <h3>Mandatory fields</h3>
    {% for item in reference.fields["required"] %}
        <div>
            <label name="{{item}}" for="{{item}}">
                {{item}}:
                <input name="{{item}}" id="{{item}}" required>
            </label>
        </div>
    {% endfor %}

    <h3>Optional fields</h3>
    {% for item in reference.fields["optional"] %}
        <div>
            <label name="{{item}}" for="{{item}}">
                {{item}}:
                <input name="{{item}}" id="{{item}}">
            </label>
        </div>
    {% endfor %}

    <h3>Non-standard fields</h3>
    {% for item in reference.fields["non_standard"] %}
        <div>
            <label name="{{item}}" for="{{item}}">
                {{item}}:
                <input name="{{item}}" id="{{item}}">
            </label>
        </div>
    {% endfor %}
    <input type="hidden" name="type" value="{{reference.type}}">

    <button>Add a reference</button>
  </form>
</div>
