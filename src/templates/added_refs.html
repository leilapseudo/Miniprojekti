<div>
    {% if refs|length == 0 %}
    <h3>No references have been added yet</h3>
    {% elif refs|length > 0 %}
    <ul>
        {% for item in refs%}
        <li>
            <input type="checkbox" name={{item}} />
            <label for={{item}}>{{item}}</label>
        </li>
        {% endfor %}
    </ul>
    {% endif %}
</div>
