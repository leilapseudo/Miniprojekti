<div>
    {% if refs|length == 0 %}
    <h3>No references have been added yet</h3>
    {% elif refs | length > 0 %}
      <form>
        <ul>
        {% for item in refs %}
          <li>
            <input type="hidden" value="{{ item.info }}">
            <input type="radio" name="id" value="{{ item.info.id }}" required>
              {% for col in item.info.items() %}
                {% if item.id != "viite_id" %}
                  <b>{{col[0]}}: </b> <i>{{col[1]}}</i>
                {% endif %}
              {% endfor %}

          </li>
        {% endfor %}
        </ul>
        <button type="submit" formaction="/edit" formmethod="get">Edit selected</button>
        <button type="submit" formaction="/delete" formmethod="post">Delete selected</button>
      </form>
    {% endif %}
</div>
